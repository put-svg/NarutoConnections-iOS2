name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  source-preflight:
    name: Source preflight (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate project.yml
        run: |
          echo "Repository root:"
          pwd
          echo "Searching for project.yml..."
          find . -maxdepth 6 -name project.yml -print
          test -n "$(find . -maxdepth 6 -name project.yml -print -quit)"

  build:
    name: Build unsigned IPA
    needs: source-preflight
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          SPEC="$(find . -maxdepth 6 -name project.yml -print -quit)"
          test -n "$SPEC"
          SPEC_DIR="$(dirname "$SPEC")"
          cd "$SPEC_DIR"
          xcodegen generate --spec project.yml
          PROJECT="$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          echo "PROJECT_PATH=$SPEC_DIR/$PROJECT" >> "$GITHUB_ENV"

      - name: Check Xcode project
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build app for iPhone (unsigned)
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme NarutoConnections \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p build/package/Payload
          cp -R "$APP" build/package/Payload/
          cd build/package
          zip -qry ../NarutoConnections-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarutoConnections-unsigned-IPA
          path: build/NarutoConnections-unsigned.ipa
          if-no-files-found: error
