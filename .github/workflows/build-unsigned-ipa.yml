name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:
    inputs:
      runner_pool:
        description: Select macOS runner
        required: true
        default: macos-15-intel
        type: choice
        options:
          - macos-15-intel
          - macos-15

jobs:
  source-preflight:
    name: Source preflight (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Xcode project..."
          test -d NarutoConnections.xcodeproj
          test -f NarutoConnections.xcodeproj/project.pbxproj
          echo "Xcode project files found."

      - name: List project files
        run: |
          find NarutoConnections.xcodeproj -maxdepth 3 -type f | sort

  build:
    name: Build unsigned IPA
    needs: source-preflight
    runs-on: ${{ github.event.inputs.runner_pool || 'macos-15-intel' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build app for iPhone (unsigned)
        run: |
          xcodebuild \
            -project NarutoConnections.xcodeproj \
            -scheme NarutoConnections \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/NarutoConnections.app"
          test -d "$APP"
          mkdir -p build/package/Payload
          cp -R "$APP" build/package/Payload/
          cd build/package
          zip -qry ../NarutoConnections-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarutoConnections-unsigned-IPA
          path: build/NarutoConnections-unsigned.ipa
          if-no-files-found: error
