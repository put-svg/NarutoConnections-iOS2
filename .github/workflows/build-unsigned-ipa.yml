name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  source-preflight:
    name: Source preflight (Ubuntu)
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.locate.outputs.has_project }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Diagnose project files
        id: locate
        run: |
          echo "===== REPOSITORY ROOT ====="
          pwd

          echo "===== ROOT FILES ====="
          ls -la

          echo "===== ALL PROJECT FILES ====="
          find . -type f \( \
            -name 'project.yml' -o \
            -name '*.xcodeproj' -o \
            -name '*.xcworkspace' -o \
            -name 'Package.swift' \
          \) -print

          SPEC="$(find "$GITHUB_WORKSPACE" -type f -name project.yml -print -quit)"

          if [ -n "$SPEC" ]; then
            echo "PROJECT_YML_FOUND=$SPEC"
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "PROJECT_YML_NOT_FOUND"
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build unsigned IPA
    needs: source-preflight
    if: needs.source-preflight.outputs.has_project == 'true'
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          SPEC="$(find "$GITHUB_WORKSPACE" -type f -name project.yml -print -quit)"
          test -n "$SPEC"
          SPEC_DIR="$(dirname "$SPEC")"
          xcodegen generate --spec "$SPEC"

          PROJECT="$(find "$SPEC_DIR" -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Check Xcode project
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build app for iPhone
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme NarutoConnections \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p build/package/Payload
          cp -R "$APP" build/package/Payload/
          cd build/package
          zip -qry ../NarutoConnections-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarutoConnections-unsigned-IPA
          path: build/NarutoConnections-unsigned.ipa
          if-no-files-found: error
