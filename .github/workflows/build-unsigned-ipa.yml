name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  source-preflight:
    name: Source preflight (Ubuntu)
    runs-on: ubuntu-24.04
    outputs:
      has_project: ${{ steps.check.outputs.has_project }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Inspect ZIP project
        id: check
        run: |
          ZIP="NarutoConnections_iOS_v7_GitHubBuild.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ไม่พบไฟล์ ZIP"
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/naruto-check
          unzip -q "$ZIP" -d /tmp/naruto-check

          PROJECT=$(find /tmp/naruto-check \
            -type d -name "NarutoConnections.xcodeproj" \
            -print -quit)

          if [ -n "$PROJECT" ]; then
            echo "พบ Xcode project: $PROJECT"
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "ไม่พบ NarutoConnections.xcodeproj ภายใน ZIP"
            find /tmp/naruto-check -maxdepth 5 -type f | head -100
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build unsigned IPA
    needs: source-preflight
    if: needs.source-preflight.outputs.has_project == 'true'
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Extract project ZIP
        run: |
          mkdir -p build/unpacked
          unzip -q NarutoConnections_iOS_v7_GitHubBuild.zip \
            -d build/unpacked

      - name: Locate Xcode project
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/build/unpacked" \
            -type d -name "NarutoConnections.xcodeproj" \
            -print -quit)

          test -n "$PROJECT"
          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Check Xcode project
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build app for iPhone
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme NarutoConnections \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          DERIVED="$GITHUB_WORKSPACE/build/DerivedData"

          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name "*.app" -print -quit)

          test -n "$APP"

          mkdir -p build/package/Payload
          cp -R "$APP" build/package/Payload/

          cd build/package
          zip -qry ../NarutoConnections-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarutoConnections-unsigned-IPA
          path: build/NarutoConnections-unsigned.ipa
          if-no-files-found: error
